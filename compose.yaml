name: crio

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crio
      POSTGRES_USER: crio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in your environment file}
    volumes:
      - crio_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crio -d crio"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  app:
    image: ${CRIO_IMAGE:-ghcr.io/cedricpdp/cr.io:latest}
    build:
      context: .
    restart: unless-stopped
    init: true
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://crio:${POSTGRES_PASSWORD}@database:5432/crio
    ports:
      - "${CRIO_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

volumes:
  crio_database:
