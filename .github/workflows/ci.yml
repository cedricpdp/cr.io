name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Build production image
        run: docker build --tag crio:ci .
      - name: Smoke-test production image
        run: |
          docker run --detach --name crio-ci --publish 18000:8000 crio:ci
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:18000/api/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18000/ | grep --quiet "cr.io"
      - name: Container logs on failure
        if: failure()
        run: docker logs crio-ci || true
