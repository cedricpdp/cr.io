name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Build and smoke-test production image
        run: |
          docker build --tag crio:production .
          docker run --detach --name crio-prod-test --publish 18000:8000 crio:production
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:18000/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18000/ | grep --quiet "cr.io"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare static site
        run: |
          mkdir public
          cp index.html styles.css app.js public/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
